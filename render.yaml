services:
  - type: web
    name: pulmoalert-sensor-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
    disk:
      name: data
      mountPath: /tmp
      sizeGB: 1
